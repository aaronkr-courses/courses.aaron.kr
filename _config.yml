# ─────────────────────────────────────────
# Jekyll Settings
# ─────────────────────────────────────────
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - "*.old.html"
  - node_modules/
  - bin/
  - 2023-course-sites/
  - 2023-migration-notes.md
  - CLAUDE.md
  - ACCESSIBILITY_AUDIT.md

# ─────────────────────────────────────────
# Plugins (GitHub Pages compatible)
# ─────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# ─────────────────────────────────────────
# Defaults
# ─────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: "courses"
    values:
      layout: course
  - scope:
      path: "_pages"
    values:
      layout: page
  - scope:
      path: "attend"
    values:
      sitemap: false
  - scope:
      path: "assets/pdf"
    values:
      sitemap: false
