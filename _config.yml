# ─────────────────────────────────────────
# Layout
# ─────────────────────────────────────────
navbar_fixed: true

# ─────────────────────────────────────────
# Display defaults
# Used only when the visitor has NOT clicked a toggle on that computer
# (a click saves their own choice to localStorage, which always wins).
# ─────────────────────────────────────────
display_defaults:
  theme: dark               # dark | light
  thumbs: true              # course thumbnail images on home + archive
  waves: true               # animated hero waves (home + office hours)
  lang: ko                  # en | ko — fallback language
  # Pick the language of the school taught today (`lang` on each entry in
  # _data/office_hours.yml `schedule:`). Course pages always default to their
  # own school's language. Weekends / vacation / no match → `lang` above.
  lang_from_schedule: true

# ─────────────────────────────────────────
# Collections
# ─────────────────────────────────────────
collections:
  courses:
    output: true
    permalink: /courses/:path/

# ─────────────────────────────────────────
# Archive pagination
# University courses are paginated by year (newest first): page 1 = the newest
# `years_per_page` years, page 2 the next block, and so on. The LAST university page
# that exists (a `_pages/archive*.md` file with `archive_page: N`) also takes every
# older year, so nothing is ever hidden. Categories with `group: hs` (online + high
# school) skip the university pages and are listed only on /archive/hs/, the final page.
# ─────────────────────────────────────────
archive:
  years_per_page: 5

