<script>
// Shared today-pill logic. Exposes window.TodayPill used by index.md and office-hours.md.
// Each page calls TodayPill.updatePill() then adds its own extras (e.g., day-card highlight).
// Schedule + vacation data come from _data/office_hours.yml (single source of truth —
// see CLAUDE.md "Office hours / today pill data" for how to update it each semester).
(function(g) {
  var DATA = {{ site.data.office_hours | jsonify }};
  var UNIS = {{ site.data.universities | jsonify }};
  var DAY_NAMES = {
    1: { en: 'Monday',    ko: '월요일' },
    2: { en: 'Tuesday',   ko: '화요일' },
    3: { en: 'Wednesday', ko: '수요일' },
    4: { en: 'Thursday',  ko: '목요일' },
    5: { en: 'Friday',    ko: '금요일' }
  };

  function uniByAbbr(abbr) {
    for (var i = 0; i < UNIS.length; i++) if (UNIS[i].abbr === abbr) return UNIS[i];
    return null;
  }

  // Build weekday(1-5) -> { en, ko } display text from _data/office_hours.yml
  var SCH = {};
  (DATA.schedule || []).forEach(function(entry) {
    var u = uniByAbbr(entry.uni);
    if (!u) return;
    var dn = DAY_NAMES[entry.display_day];
    if (!dn) return;
    SCH[entry.display_day] = {
      en: entry.uni.toUpperCase() + ' — ' + u.name,
      ko: u.name_ko + ' (' + dn.ko + ')'
    };
  });

  function isKo() { return document.documentElement.classList.contains('ko'); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // Returns the matching vacation-window object from _data/office_hours.yml, or null.
  function currentVacation() {
    var n = new Date(), mmdd = pad2(n.getMonth() + 1) + '-' + pad2(n.getDate());
    var windows = DATA.vacation || [];
    for (var i = 0; i < windows.length; i++) {
      var w = windows[i];
      var inRange = w.start <= w.end
        ? (mmdd >= w.start && mmdd <= w.end)
        : (mmdd >= w.start || mmdd <= w.end); // window wraps New Year's
      if (inRange) return w;
    }
    return null;
  }

  // Returns today's ISO date (YYYY-MM-DD), local time.
  function isoToday() {
    var n = new Date();
    return n.getFullYear() + '-' + pad2(n.getMonth() + 1) + '-' + pad2(n.getDate());
  }

  // Returns the matching intensive-session window (_data/office_hours.yml `sessions`),
  // plus 1-indexed day/total counts, or null. Unlike currentVacation(), these use full
  // ISO dates since a session is a one-off block, not a recurring annual window.
  function currentSession() {
    var iso = isoToday();
    var list = DATA.sessions || [];
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (iso >= s.start && iso <= s.end) {
        var msPerDay = 86400000;
        var start = new Date(s.start + 'T00:00:00');
        var end = new Date(s.end + 'T00:00:00');
        var today = new Date(iso + 'T00:00:00');
        var dayNum = Math.round((today - start) / msPerDay) + 1;
        var total = Math.round((end - start) / msPerDay) + 1;
        return Object.assign({}, s, { dayNum: dayNum, total: total });
      }
    }
    return null;
  }

  // Returns { type: 'session'|'vacation'|'weekend'|'class'|'noclass', day: 0-6, session?|vacation? }
  function status() {
    var day = new Date().getDay();
    var sess = currentSession();
    if (sess)                return { type: 'session',  day: day, session: sess };
    var vac = currentVacation();
    if (vac)                return { type: 'vacation', day: day, vacation: vac };
    if (!day || day === 6)  return { type: 'weekend',  day: day };
    if (SCH[day])           return { type: 'class',    day: day };
    return                         { type: 'noclass',  day: day };
  }

  // Basic pill update — sufficient for most pages
  function updatePill() {
    var pill = document.getElementById('today-pill');
    var txt  = document.getElementById('today-text');
    if (!pill || !txt) return;
    var s = status(), ko = isKo();
    if (s.type === 'session') {
      var d = s.session;
      txt.textContent = (ko ? d.label_ko : d.label_en) + ' · Day ' + d.dayNum + '/' + d.total;
    } else if (s.type === 'vacation') {
      pill.classList.add('noclass');
      txt.textContent = ko ? (s.vacation.label_ko || '방학 — 연구 모드') : (s.vacation.label_en || 'Vacation — Research Mode');
    } else if (s.type === 'weekend') {
      pill.classList.add('noclass');
      txt.textContent = ko ? '주말 — 휴강' : 'Weekend — No Class';
    } else if (s.type === 'class') {
      txt.textContent = (ko ? '오늘: ' : 'Today: ') + (ko ? SCH[s.day].ko : SCH[s.day].en);
    } else {
      pill.classList.add('noclass');
      txt.textContent = ko ? '오늘은 강의 없음' : 'No Class Today';
    }
  }

  g.TodayPill = { status: status, updatePill: updatePill, isKo: isKo, SCH: SCH };
})(window);
</script>
