<script>
// ── Sidebar active-section tracking ─────────────────────────────────────────
const sIds = ['grading','schedule','overview','textbooks','instructor','policies'];
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
      const a = document.querySelector(`.sidebar-nav a[href="#${e.target.id}"]`);
      if (a) a.classList.add('active');
    }
  });
}, { rootMargin: '-25% 0px -65% 0px' });
sIds.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
</script>
<script>
// ── Quick-link dropdowns: one open at a time, close on outside click / Esc ────────
(function() {
  const dds = [...document.querySelectorAll('.ql-dd')];
  if (!dds.length) return;
  dds.forEach(d => d.addEventListener('toggle', () => {
    if (!d.open) return;
    dds.forEach(o => { if (o !== d && !o.contains(d)) o.open = false; });
    const r = d.getBoundingClientRect();
    d.classList.toggle('align-right', r.left + 220 > window.innerWidth);
  }));
  document.addEventListener('click', e => {
    dds.forEach(d => { if (d.open && !d.contains(e.target)) d.open = false; });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') dds.forEach(d => { d.open = false; });
  });
})();
</script>
